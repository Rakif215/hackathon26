[project]
name = "hackathon26"
version = "0.1.0"
description = "Trustworthy healthcare AI on Exasol — Healthcare Hackathon Bayern 2026"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.44.2",
    "fastapi>=0.162.6",
    "pyexasol>=1.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
]
